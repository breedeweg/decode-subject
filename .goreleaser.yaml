version: 2

project_name: decode-subject

before:
  hooks:
    - go vet ./...
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true
    files:
      - README.md

checksum:
  name_template: checksums.txt

# Release notes are the annotated tag's message (everything after its first
# line) followed by the download and install instructions below.
changelog:
  disable: true

release:
  header: |
    {{ .TagBody }}
  footer: |
    {{- $dl := printf "https://github.com/breedeweg/decode-subject/releases/download/%s" .Tag -}}
    {{- $name := printf "%s_%s" .ProjectName .Version }}
    ## Download

    Prebuilt binaries need no Go installation. Each archive contains the binary and the README.

    | OS | Intel / AMD (x86-64) | ARM (arm64) |
    |---|---|---|
    | macOS | [darwin_amd64.tar.gz]({{ $dl }}/{{ $name }}_darwin_amd64.tar.gz) | [darwin_arm64.tar.gz]({{ $dl }}/{{ $name }}_darwin_arm64.tar.gz) (Apple silicon) |
    | Linux | [linux_amd64.tar.gz]({{ $dl }}/{{ $name }}_linux_amd64.tar.gz) | [linux_arm64.tar.gz]({{ $dl }}/{{ $name }}_linux_arm64.tar.gz) |
    | Windows | [windows_amd64.zip]({{ $dl }}/{{ $name }}_windows_amd64.zip) | [windows_arm64.zip]({{ $dl }}/{{ $name }}_windows_arm64.zip) |

    Verify a download against [`checksums.txt`]({{ $dl }}/checksums.txt):

    ```sh
    shasum -a 256 -c checksums.txt --ignore-missing
    ```

    The macOS binaries are not signed. If you download one with a browser and macOS refuses to run it, remove the quarantine flag:

    ```sh
    xattr -d com.apple.quarantine decode-subject
    ```

    ## Install with Go

    Requires Go 1.26 or later.

    ```sh
    go install github.com/breedeweg/decode-subject@{{ .Tag }}
    ```
